<!DOCTYPE html>
<html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sổ Việc Cần Làm</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#fbf8f0;--paper-edge:#f1ecdf;--line:#dfe6da;--ink:#1d3c78;--ink-soft:#3a5a9a;--red:#cf3a2c;--highlight:#cdead0;--highlight-2:#c7e6f5;--shadow:rgba(29,60,120,0.14)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;min-height:100vh;background:#e9e4d6;font-family:'Be Vietnam Pro',sans-serif;color:var(--ink);-webkit-tap-highlight-color:transparent}
.split{display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:8px 40px;padding:40px 16px;max-width:1040px;margin:0 auto}
.person-col{width:100%;max-width:460px;display:flex;flex-direction:column}
.person-col.hien{--highlight:var(--highlight-2)}
.col-divider{align-self:stretch;width:1px;background:rgba(29,60,120,.14);margin:6px 0}
@media(max-width:940px){.col-divider{display:none}.split{gap:44px 0;padding:24px 16px}.person-col{max-width:480px}}
h1{font-weight:800;font-size:1.7rem;margin:0 0 18px;text-align:center}
.status-banner{background:#fff7e6;border:1.5px dashed #d8b25c;color:#7a5c17;font-size:.85rem;padding:10px 14px;border-radius:8px;text-align:center;margin-bottom:16px}
.status-banner[hidden]{display:none}
.drawer{margin-bottom:22px;background:rgba(255,255,255,.55);border:2px dashed #b9c6de;border-radius:10px;padding:8px 14px}
.drawer summary{cursor:pointer;font-weight:600;color:var(--ink-soft);list-style:none}
.drawer summary::-webkit-details-marker{display:none}
.drawer-body{margin-top:16px}.drawer-note{font-size:.8rem;color:#8a95ab;font-style:italic;margin:0 0 14px}
.drawer .day-note{margin-bottom:22px}
.panel{background:var(--paper);border-radius:8px;box-shadow:0 10px 22px var(--shadow);padding:16px 18px;margin-bottom:26px;border-top:5px solid #7fb6e0}
.panel h2{margin:0 0 4px;font-size:1.12rem;font-weight:700}
.panel .sub{font-size:.82rem;color:var(--ink-soft);margin-bottom:10px}
.lvbar{display:flex;gap:5px;margin:8px 0 4px}
.lvbar span{flex:1;text-align:center;font-size:.75rem;font-weight:700;padding:3px 0;border-radius:6px;background:#e4ebf5;color:#8a95ab}
.lvbar span.on{background:#7fb6e0;color:#fff}.lvbar span.past{background:#cdead0;color:#2d6b3c}
.prog{height:9px;background:#e4ebf5;border-radius:6px;overflow:hidden;margin:6px 0 12px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#7fb6e0,#5aa97a)}
.ex-row{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px dashed var(--line)}
.ex-ico{font-size:1.7rem;width:42px;text-align:center;flex:none}
.ex-info{flex:1;min-width:0}.ex-name{font-weight:600;font-size:.95rem}.ex-hint{font-size:.74rem;color:var(--ink-soft);line-height:1.3}
.ex-sq{display:flex;gap:6px;flex:none}
.sq{width:28px;height:28px;border:2.4px solid var(--ink);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--red);font-weight:bold;cursor:pointer;user-select:none;position:relative}
.sq::before{content:"";position:absolute;inset:-7px}.sq.on{background:#eaf6ec}.sq.lock{opacity:.6;cursor:default}
.part{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:.72rem;color:var(--ink-soft);cursor:pointer;user-select:none}.part .sq{width:20px;height:20px;border-width:2px;font-size:.8rem}
.btn{font-family:inherit;font-size:.92rem;font-weight:600;color:var(--ink);background:var(--highlight);border:none;border-radius:8px;padding:9px 14px;cursor:pointer;margin-top:10px;width:100%}
.btn.off{background:#e4ebf5;color:#6b7a99}
.btn.gold{background:linear-gradient(90deg,#ffd45e,#ff9d5c);color:#5b2a00;animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 6px rgba(255,170,60,.25)}}
.msg{font-size:.85rem;margin-top:8px;color:#2d6b3c;font-weight:600}
.warn{font-size:.85rem;margin-top:8px;padding:7px 10px;border-radius:8px;background:#fff1e0;color:#9a4b00}
.warn.bad{background:#fde6e3;color:var(--red)}
.stat{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;margin:6px 0}
.modal{position:fixed;inset:0;background:rgba(20,30,60,.65);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal.show{display:flex}
.wheel-card{background:var(--paper);border-radius:16px;padding:20px 16px;max-width:380px;width:100%;text-align:center}
.wheel-wrap{position:relative;width:min(300px,78vw);aspect-ratio:1;margin:10px auto 14px}
.wheel-wrap .ptr{position:absolute;top:-12px;left:50%;transform:translateX(-50%);font-size:1.8rem;z-index:2}
#wheel{width:100%;height:100%;transition:transform 5s cubic-bezier(.12,.6,.1,1)}
.result{font-size:1.15rem;font-weight:800;min-height:1.6em;margin-bottom:6px}
.timer{font-size:3.4rem;font-weight:800;margin:14px 0}
.day-note{position:relative;margin-bottom:30px}
.day-note::before,.day-note::after{content:"";position:absolute;inset:0;background:var(--paper-edge);border-radius:6px;z-index:0}
.day-note::before{transform:rotate(var(--rot-a,-2deg)) translateY(5px)}.day-note::after{transform:rotate(var(--rot-b,1.4deg)) translateY(2px)}
.day-note-inner{position:relative;z-index:1;transform:rotate(var(--rot-c,0deg));background:repeating-linear-gradient(var(--paper),var(--paper) 37px,var(--line) 38px);border-radius:6px;box-shadow:0 14px 26px var(--shadow);padding:22px 22px 22px 48px}
.day-note-inner::before{content:"";position:absolute;top:22px;bottom:22px;left:18px;width:11px;background-image:radial-gradient(circle,#cfc9b8 0 4.5px,transparent 5px);background-size:11px 42px;background-repeat:repeat-y;opacity:.6}
.day-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.day-date-wrap{position:relative;display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.day-date-label{font-size:1.2rem;padding:1px 8px 3px;background:linear-gradient(to bottom,transparent 55%,var(--highlight) 55%);white-space:nowrap}
.day-date-label.placeholder{color:#8a95ab;font-style:italic;background:none}
.cal-btn{background:none;border:none;font-size:1rem;opacity:.55;cursor:pointer;padding:2px}
.day-date-input{position:absolute;left:0;top:0;width:1px;height:1px;opacity:0;border:none;padding:0;margin:0;pointer-events:none}
.day-actions{display:flex;gap:6px}
.icon-btn{background:none;border:none;color:var(--ink-soft);font-size:1.05rem;cursor:pointer;opacity:.55;padding:2px 4px}
.icon-btn:hover{opacity:1}
.tasks{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:flex-start;gap:10px;padding:5px 0;font-size:1.1rem;line-height:1.35}
.box{flex:0 0 auto;width:24px;height:24px;margin-top:3px;border:2.4px solid var(--ink);border-radius:3px 4px 3px 5px;transform:rotate(-1.2deg);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--red);font-size:1.05rem;font-weight:bold;user-select:none;position:relative}
.box::before{content:"";position:absolute;inset:-11px}
@keyframes overdue-pulse{0%,100%{box-shadow:0 0 0 0 rgba(207,58,44,.45);transform:rotate(-1.2deg) scale(1)}50%{box-shadow:0 0 0 5px rgba(207,58,44,0);transform:rotate(-1.2deg) scale(1.06)}}
.box.overdue{border-color:var(--red);animation:overdue-pulse 1.7s ease-in-out infinite}
.task.overdue .task-text{color:var(--red)}
.task.overdue .task-text::after{content:" (trễ hạn)";font-size:.78em;font-style:italic;opacity:.75}
.task.late .task-text::after{content:" (làm trễ)";font-size:.78em;font-style:italic;color:#c77a00}
@media(prefers-reduced-motion:reduce){.box.overdue,.btn.gold{animation:none}}
.task-text{flex:1;word-break:break-word}
.task.done .task-text{color:var(--ink-soft)}
.task.cancelled .task-text{text-decoration:line-through;text-decoration-thickness:2px;opacity:.55}
.del{opacity:0;background:none;border:none;color:var(--red);cursor:pointer;font-size:1rem;padding:2px 4px}
.task:hover .del{opacity:.6}.del:hover{opacity:1!important}
.add-task-row{display:flex;align-items:center;gap:10px;padding:6px 0 0 32px}
.add-task-row input{flex:1;border:none;border-bottom:1.5px dashed #b9c6de;background:transparent;font-family:inherit;font-size:1.06rem;color:var(--ink);padding:2px;min-width:0}
.add-task-row input:focus{outline:none;border-bottom-color:var(--ink)}
.add-task-row button{background:none;border:none;color:var(--ink-soft);cursor:pointer;font-size:1.4rem;opacity:.7}
.empty-day{font-size:1rem;color:#8a95ab;padding-left:32px;font-style:italic}
.add-day{display:flex;justify-content:center;margin-top:4px}
.add-day button{font-family:inherit;font-size:1.02rem;color:var(--ink-soft);background:transparent;border:2px dashed #b9c6de;border-radius:8px;padding:8px 18px;cursor:pointer}
@media(max-width:480px){.split{padding:16px 10px;gap:28px 0}.day-note-inner{padding:18px 16px 18px 38px}.day-note-inner::before{left:10px}h1{font-size:1.5rem}.task{font-size:1rem}.add-task-row{padding-left:30px}}
</style></head>
<body>
<div class="split">
  <section class="person-col bao"><h1>Bảo</h1><div class="status-banner" id="status-bao" hidden></div>
    <details class="drawer" id="drawer-bao"><summary>🗄️ Ngăn kéo (<span class="cnt">0</span>)</summary><div class="drawer-body"></div></details>
    <div id="days-bao"></div><div class="add-day"><button data-person="bao">+ thêm ngày</button></div></section>
  <div class="col-divider"></div>
  <section class="person-col hien"><h1>Hiền</h1><div class="status-banner" id="status-hien" hidden></div>
    <details class="drawer" id="drawer-hien"><summary>🗄️ Ngăn kéo (<span class="cnt">0</span>)</summary><div class="drawer-body"></div></details>
    <div id="hien-extra"></div><div id="days-hien"></div><div class="add-day"><button data-person="hien">+ thêm ngày</button></div></section>
</div>

<div class="modal" id="modal"><div class="wheel-card"><h2 style="margin:0">🎁 Vòng quay may mắn</h2>
  <div class="wheel-wrap"><div class="ptr">🔻</div><svg id="wheel" viewBox="-100 -100 200 200"></svg></div>
  <div class="result" id="result"></div><button class="btn" id="spinGo">QUAY!</button><button class="btn off" id="spinClose">Đóng</button></div></div>

<div class="modal" id="tmodal"><div class="wheel-card"><h2 style="margin:0">⏱️ Plank!</h2>
  <div class="timer" id="tval">30</div><button class="btn off" id="tcancel">Hủy</button></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, onSnapshot, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDUxAPbBWVMxtexFn44-dKMSgmPM8CQAJ8",authDomain:"todo-list-d0500.firebaseapp.com",projectId:"todo-list-d0500",storageBucket:"todo-list-d0500.firebasestorage.app",messagingSenderId:"219541712256",appId:"1:219541712256:web:f7d492517f970b4c602565"};
const PEOPLE=['bao','hien'], PASS="Barone101";
const els={bao:{status:document.getElementById('status-bao'),days:document.getElementById('days-bao'),drawer:document.getElementById('drawer-bao')},hien:{status:document.getElementById('status-hien'),days:document.getElementById('days-hien'),drawer:document.getElementById('drawer-hien')}};
let db=null,docRef=null,state={bao:{days:[]},hien:{days:[]}};
const WEEKDAY_NAMES=['Chủ Nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];
const showStatusAll=m=>PEOPLE.forEach(p=>{els[p].status.hidden=false;els[p].status.textContent=m});
const hideStatusAll=()=>PEOPLE.forEach(p=>els[p].status.hidden=true);
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const isoOf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const todayISO=()=>isoOf(new Date());
const isPastDate=iso=>!!iso&&iso<todayISO();
function formatDayLabel(iso){if(!iso)return null;const d=new Date(iso+'T00:00:00');if(isNaN(d))return null;return `${WEEKDAY_NAMES[d.getDay()]}, ${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}`}
function hashRot(id){let h=0;for(let i=0;i<id.length;i++)h=(h*31+id.charCodeAt(i))%1000;return{a:-2.4+(h%10)*.12,b:1.0+((h>>3)%10)*.12,c:-.9+((h>>6)%18)*.1}}
async function saveState(){if(!docRef)return;try{await setDoc(docRef,state)}catch(e){showStatusAll("Không lưu được: "+e.message)}}

// ---- week helpers (Mon..Sun, closes Sun 23:50) ----
function weekKeyOfDate(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-((x.getDay()+6)%7));return isoOf(x)}
function currentWeekKey(){const n=new Date();if(n.getDay()===0&&n.getHours()*60+n.getMinutes()>=23*60+50)n.setDate(n.getDate()+1);return weekKeyOfDate(n)}
function addDaysISO(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return isoOf(d)}
const MAXLIVES=2;
function weekStats(key,live){
  const h=state.hien,today=todayISO();
  const wd=h.days.filter(d=>d.date&&weekKeyOfDate(new Date(d.date+'T00:00:00'))===key&&d.tasks.length>0);
  const okDays=wd.filter(d=>!d.tasks.some(t=>t.state==='pending')).length;
  const overdueDays=wd.filter(d=>(live?d.date<today:true)&&d.tasks.some(t=>t.state==='pending')).length;
  const checks=h.checkins.filter(c=>weekKeyOfDate(new Date(c+'T00:00:00'))===key).length;
  return{okDays,totalDays:wd.length,overdueDays,lives:Math.max(0,MAXLIVES-overdueDays),checks};
}
function evaluateWeeks(){
  const h=state.hien,r=h.reward,cur=currentWeekKey();let changed=false;
  if(!r.last){r.last=addDaysISO(cur,-7);changed=true}
  let g=0;
  while(addDaysISO(r.last,7)<cur&&g++<12){
    const k=addDaysISO(r.last,7),s=weekStats(k,false);
    if(s.lives>=1&&s.checks>=3)r.spins=Math.min(2,r.spins+1);
    if(h.ngoan[k]!==false)r.spins=Math.min(2,r.spins+1); // ngoan bonus
    r.last=k;changed=true;
  }
  return changed;
}
// new day: clear ticks; a check-in day without a full workout resets level progress
function rollExercise(){
  const ex=state.hien.ex,t=todayISO();let c=false;
  if(ex.tickDate&&ex.tickDate<t){
    if(state.hien.checkins.includes(ex.tickDate)&&ex.lastSession!==ex.tickDate&&ex.sessions>0)ex.sessions=0;
    ex.ticks=ex.ticks.map(()=>false);ex.part=[false,false,false,false];ex.msg='';ex.tickDate=t;c=true;
  }
  return c;
}
function cleanupOldMonths(){
  const m=todayISO().slice(0,7);let ch=false;
  PEOPLE.forEach(p=>{const b=state[p].days.length;state[p].days=state[p].days.filter(d=>!d.date||d.date.slice(0,7)>=m);if(state[p].days.length!==b)ch=true});
  return ch;
}

// ---- exercise ----  [icon,name,reps,sets,hint]
const LEVELS=[
 [["🛏️","Push-up tựa giường",5,2,"Hai tay chống mép giường, người thẳng"],["🪑","Squat",8,3,"Ngồi xuống như ngồi ghế, lưng thẳng"],["👏","Jump clap",30,1,"Nhảy lên, vỗ tay trên đầu"],["⏱️","Plank (giây)",30,1,"Làm cuối buổi tập"]],
 [["🛏️","Push-up tựa giường",10,2,"Hai tay chống mép giường"],["🪑","Squat",15,3,"Ngồi xuống sâu hơn"],["👏","Jump clap",40,1,"Nhảy lên, vỗ tay trên đầu"],["⏱️","Plank (giây)",35,1,"Giữ chắc bụng"]],
 [["🦵","Push-up quỳ gối",15,2,"Quỳ gối trên sàn, gót chân chạm mông, đầu gối chạm đất, hạ ngực xuống"],["🪑","Squat",20,3,"Đều và chậm"],["👏","Jump clap",50,1,"Nhảy lên, vỗ tay trên đầu"],["⏱️","Plank (giây)",45,1,"Đừng võng lưng"]],
 [["🦵","Push-up quỳ gối",7,2,"Quỳ gối trên sàn, gót chân chạm mông, đầu gối chạm đất, hạ ngực xuống"],["🪑","Squat",30,3,"Đều, lưng thẳng"],["👏","Jump clap",50,2,"Nhảy lên, vỗ tay trên đầu"],["⏱️","Plank (giây)",50,1,"Giữ chắc bụng"]],
 [["💪","Push-up không giường",10,3,"Hạ ngực sát sàn"],["🏋️","Squat",30,3,"Sâu, đều, lưng thẳng"],["👏","Jump clap",50,2,"Nhảy lên, vỗ tay trên đầu"],["⏱️","Plank (1 phút)",60,1,"Giữ 1 phút"]]
];
const NEED=6;
const plankSecs=lv=>LEVELS[lv-1][3][2];
const totalSets=lv=>LEVELS[lv-1].reduce((a,e)=>a+e[3],0);
const exComplete=(ex,i)=>{let o=0;for(let k=0;k<i;k++)o+=LEVELS[ex.lv-1][k][3];let ok=true;for(let k=0;k<LEVELS[ex.lv-1][i][3];k++)if(!ex.ticks[o+k])ok=false;return ok||!!ex.part[i]};
function addCheckin(){const t=todayISO();if(!state.hien.checkins.includes(t))state.hien.checkins.push(t);state.hien.ex.tickDate=t}

let timerId=null;
function plankTimer(secs,cb){
  const m=document.getElementById('tmodal'),v=document.getElementById('tval');let left=secs;
  v.textContent=left;m.classList.add('show');
  clearInterval(timerId);
  timerId=setInterval(()=>{left--;v.textContent=left;if(left<=0){clearInterval(timerId);m.classList.remove('show');setTimeout(()=>cb(confirm('Bạn có plank đủ thời gian không?')),100)}},1000);
}
document.getElementById('tcancel').addEventListener('click',()=>{clearInterval(timerId);document.getElementById('tmodal').classList.remove('show')});

function finishTick(){
  const ex=state.hien.ex,today=todayISO();
  ex.msg='';
  const allDone=LEVELS[ex.lv-1].every((e,i)=>exComplete(ex,i));
  if(allDone&&ex.doneDate!==today){
    ex.doneDate=today;
    if(!ex.part.some(Boolean)){
      ex.lastSession=today;ex.sessions++;
      if(ex.sessions>=NEED&&ex.lv<5){ex.lv++;ex.sessions=0;ex.ticks=Array(totalSets(ex.lv)).fill(false);ex.part=[false,false,false,false];ex.msg=`🎉 Lên Level ${ex.lv} rồi! (nghỉ tới ngày mai nhé)`}
      else ex.msg='✅ Xong buổi tập hôm nay!';
    }else ex.msg='💪 Đã ghi nhận — hôm nay vẫn được điểm danh, nhưng chưa tính vào level.';
  }
  renderHien();saveState();
}

function renderHien(){
  const box=document.getElementById('hien-extra');box.innerHTML='';
  const h=state.hien,ex=h.ex,r=h.reward,lv=LEVELS[ex.lv-1],today=todayISO();
  const locked=ex.doneDate===today||ex.lastSession===today;
  const p=document.createElement('div');p.className='panel';
  const checked=h.checkins.includes(today);
  p.innerHTML=`<h2>🏋️ Tập luyện — Level ${ex.lv}/5</h2>
   <div class="sub">Tối đa 1 buổi/ngày. Làm đủ hết bài ${NEED} buổi là lên level. Bài nào không làm hết thì tick ô "có tập nhưng không hoàn thành hết": vẫn được điểm danh và thưởng tuần, nhưng tiến độ level về 0.</div>
   ${checked?'<div class="msg" style="margin:0 0 8px">✨ Sau khoá tập này Tí èn sẽ thành siu mẫu</div>':''}
   <div class="lvbar">${[1,2,3,4,5].map(i=>`<span class="${i<ex.lv?'past':i===ex.lv?'on':''}">${i}</span>`).join('')}</div>
   <div class="sub" style="margin:6px 0 0">Buổi hoàn thành: ${ex.sessions}/${NEED}</div>
   <div class="prog"><i style="width:${Math.min(100,ex.sessions/NEED*100)}%"></i></div>`;
  let off=0;
  lv.forEach((e,i)=>{
    const isPlank=i===3,start=off;off+=e[3];
    const row=document.createElement('div');row.className='ex-row';
    row.innerHTML=`<div class="ex-ico">${e[0]}</div><div class="ex-info"><div class="ex-name">${e[1]} ${e[2]}${e[3]>1||!isPlank&&e[3]>=1?' × '+e[3]:''}</div><div class="ex-hint">${e[4]}</div></div>`;
    const sq=document.createElement('div');sq.className='ex-sq';
    for(let s=0;s<e[3];s++){
      const idx=start+s,on=ex.ticks[idx];
      const b=document.createElement('div');b.className='sq'+(on?' on':'')+(locked?' lock':'');b.textContent=on?'✓':'';
      b.addEventListener('click',()=>{
        if(locked)return;
        addCheckin();
        if(ex.ticks[idx]){ex.ticks[idx]=false;ex.msg='';renderHien();saveState();return}
        if(isPlank){
          if(![0,1,2].every(k=>exComplete(ex,k))){alert('Plank làm cuối buổi tập nhé — xong các bài trên trước!');renderHien();saveState();return}
          renderHien();saveState();
          plankTimer(plankSecs(ex.lv),ok=>{if(ok){ex.ticks[idx]=true;ex.part[i]=false}else{ex.part[i]=true;ex.ticks[idx]=false}finishTick()});
          return;
        }
        ex.ticks[idx]=true;ex.part[i]=false;finishTick();
      });
      sq.appendChild(b);
    }
    const pt=document.createElement('div');pt.className='part';
    const pb=document.createElement('div');pb.className='sq'+(ex.part[i]?' on':'')+(locked?' lock':'');pb.textContent=ex.part[i]?'✓':'';
    pt.append(pb,document.createTextNode('có tập nhưng không hoàn thành hết'));
    pt.addEventListener('click',()=>{
      if(locked)return;
      addCheckin();
      ex.part[i]=!ex.part[i];
      if(ex.part[i])for(let k=0;k<e[3];k++)ex.ticks[start+k]=false;
      finishTick();
    });
    row.querySelector('.ex-info').appendChild(pt);
    row.appendChild(sq);p.appendChild(row);
  });
  if(ex.lv===5&&ex.sessions>=NEED){const m=document.createElement('div');m.className='msg';m.textContent='🏆 Level 5 — giữ phong độ nhé!';p.appendChild(m)}
  if(ex.msg){const m=document.createElement('div');m.className='msg';m.textContent=ex.msg;p.appendChild(m)}
  const ci=document.createElement('button');ci.className='btn'+(checked?' off':'');
  ci.textContent=checked?'✅ Hôm nay đã điểm danh tập (bấm để bỏ)':'🙋 Hôm nay mình có tập (điểm danh)';
  ci.addEventListener('click',()=>{if(checked)h.checkins=h.checkins.filter(c=>c!==today);else addCheckin();renderHien();saveState()});
  p.appendChild(ci);box.appendChild(p);

  // weekly reward
  const key=currentWeekKey(),s=weekStats(key,true),ng=h.ngoan[key]!==false;
  const rp=document.createElement('div');rp.className='panel';rp.style.borderTopColor='#ffb347';
  rp.innerHTML=`<h2>🎁 Thưởng tuần</h2>
   <div class="sub">Điểm danh tập ≥ 3 buổi, còn ít nhất 1 mạng (trễ hạn 1 ngày = -1 mạng). Ngoan: +1 vòng quay. Tối đa 2 vòng. Reset Chủ Nhật 23:50.</div>
   <div class="stat"><span>🙋 Điểm danh tập</span><b>${s.checks}/3</b></div>
   <div class="stat"><span>✅ Ngày xong hết việc</span><b>${s.okDays}/${s.totalDays}</b></div>
   <div class="stat"><span>❤️ Mạng còn lại</span><b>${'❤️'.repeat(s.lives)}${'🖤'.repeat(MAXLIVES-s.lives)}</b></div>
   <div class="stat"><span>😇 Ngoan tuần này</span><div class="sq ${ng?'on':''}" id="ngoan">${ng?'✓':''}</div></div>
   <div class="stat"><span>Vòng quay đang có</span><b>🎟️ ${r.spins}/2</b></div>`;
  if(s.lives===0){const w=document.createElement('div');w.className='warn bad';w.textContent='💔 Hết mạng — tuần này không nhận được thưởng 😢';rp.appendChild(w)}
  else if(s.lives===1){const w=document.createElement('div');w.className='warn';w.textContent='⚠️ Còn 1 mạng — trễ thêm 1 ngày là mất thưởng!';rp.appendChild(w)}
  if(r.lastPrize){const l=document.createElement('div');l.className='msg';l.textContent='Lần trúng gần nhất: '+r.lastPrize;rp.appendChild(l)}
  if(r.spins>0){const b=document.createElement('button');b.className='btn gold';b.textContent='🎉 Bạn đã hoàn thành xuất sắc và nhận 1 vòng quay — ấn vào đây để nhận thưởng';b.addEventListener('click',openWheel);rp.appendChild(b)}
  box.appendChild(rp);
  rp.querySelector('#ngoan').addEventListener('click',()=>{
    const pw=prompt('Nhập mật khẩu để đổi tiêu chí Ngoan:');
    if(pw===null)return;
    if(pw!==PASS){alert('Sai mật khẩu');return}
    h.ngoan[key]=!ng;renderHien();saveState();
  });
}

// ---- spin wheel ----
const PRIZES=[
 {e:'🍗',n:'Jollibee gà rán (Giải đặc biệt!)',sp:true,c:'#e8483a'},
 {e:'🥬',n:'Rau má',c:'#7bc67e'},{e:'🥤',n:'Sinh tố',c:'#f6b73c'},{e:'🍊',n:'Nước cam',c:'#f08a5d'},
 {e:'🥥',n:'Nước dừa',c:'#c9a27e'},{e:'🍍',n:'Dứa',c:'#ffe082'},
 {e:'🥗',n:'Bánh tráng trộn',c:'#8fd0a8'},{e:'🌭',n:'Lạp xưởng nướng đá',c:'#ef9a9a'}
];
const N=PRIZES.length,SP_CHANCE=0.05;let rot=0,spinning=false;
const wheel=document.getElementById('wheel');
(function(){
  const a=2*Math.PI/N;let html='';
  PRIZES.forEach((p,i)=>{
    const a0=i*a-Math.PI/2,a1=a0+a;
    const x0=98*Math.cos(a0),y0=98*Math.sin(a0),x1=98*Math.cos(a1),y1=98*Math.sin(a1);
    const mid=a0+a/2,tx=66*Math.cos(mid),ty=66*Math.sin(mid);
    html+=`<path d="M0 0 L${x0} ${y0} A98 98 0 0 1 ${x1} ${y1} Z" fill="${p.c}" stroke="#fff" stroke-width="2"/>`;
    html+=`<text x="${tx}" y="${ty}" font-size="24" text-anchor="middle" dominant-baseline="central" transform="rotate(${mid*180/Math.PI+90} ${tx} ${ty})">${p.e}</text>`;
  });
  html+='<circle r="11" fill="#fff" stroke="#1d3c78" stroke-width="3"/>';wheel.innerHTML=html;
})();
function openWheel(){document.getElementById('result').textContent='';document.getElementById('modal').classList.add('show')}
document.getElementById('spinClose').addEventListener('click',()=>{if(!spinning)document.getElementById('modal').classList.remove('show')});
document.getElementById('spinGo').addEventListener('click',()=>{
  const r=state.hien.reward;if(spinning)return;
  if(r.spins<1){document.getElementById('result').textContent='Hết vòng quay rồi 😅';return}
  let special=Math.random()<SP_CHANCE;
  if(special&&Date.now()-(r.lastSpecial||0)<15*60*1000)special=false;
  const idx=special?0:1+Math.floor(Math.random()*(N-1));
  spinning=true;document.getElementById('result').textContent='';
  // slice i is centred at i*(360/N) clockwise; its edge starts at -90deg-offset, so centre sits at angle (i+0.5)*slice from the top
  const slice=360/N;
  rot+=360*6+((360-(rot%360))%360)-(idx+.5)*slice+(Math.random()-.5)*slice*.6;
  wheel.style.transform=`rotate(${rot}deg)`;
  setTimeout(()=>{
    spinning=false;const pz=PRIZES[idx];
    r.spins--;r.lastPrize=pz.e+' '+pz.n;if(pz.sp)r.lastSpecial=Date.now();
    document.getElementById('result').textContent=`${pz.e} ${pz.n}`;
    renderHien();saveState();
  },5200);
});

// ---- day cards ----
function renderPerson(person){
  const daysEl=els[person].days,ps=state[person],drawer=els[person].drawer,body=drawer.querySelector('.drawer-body');
  daysEl.innerHTML='';body.innerHTML='';
  ps.days.forEach(d=>{if(!d.date)d.date=todayISO()});
  const isArch=d=>isPastDate(d.date)&&!d.tasks.some(t=>t.state==='pending');
  const past=ps.days.filter(isArch).sort((a,b)=>b.date.localeCompare(a.date));
  const active=ps.days.filter(d=>!isArch(d)).sort((a,b)=>a.date.localeCompare(b.date));
  drawer.querySelector('.cnt').textContent=past.length;
  const n=document.createElement('p');n.className='drawer-note';
  n.textContent=past.length?'Các ngày đã qua và đã xong hết. Việc chưa xong luôn ở ngoài danh sách. Sang tháng mới ngăn kéo được dọn sạch.':'Chưa có ghi chú cũ nào.';
  body.appendChild(n);
  [...active,...past].forEach(day=>{
    const dayIsPast=isPastDate(day.date),rot=hashRot(day.id);
    const card=document.createElement('div');card.className='day-note';
    card.style.setProperty('--rot-a',rot.a+'deg');card.style.setProperty('--rot-b',rot.b+'deg');card.style.setProperty('--rot-c',rot.c+'deg');
    const inner=document.createElement('div');inner.className='day-note-inner';
    const header=document.createElement('div');header.className='day-header';
    const dw=document.createElement('div');dw.className='day-date-wrap';
    const label=document.createElement('span'),f=formatDayLabel(day.date);
    label.className='day-date-label'+(f?'':' placeholder');label.textContent=f||'chọn ngày...';
    const cb=document.createElement('button');cb.type='button';cb.className='cal-btn';cb.textContent='📅';
    const di=document.createElement('input');di.type='date';di.className='day-date-input';di.value=day.date||'';di.tabIndex=-1;
    di.addEventListener('change',()=>{day.date=di.value;renderPerson(person);saveState()});
    dw.addEventListener('click',()=>{
      if(typeof di.showPicker==='function'){try{di.showPicker();return}catch(e){}}
      di.style.pointerEvents='auto';di.style.opacity='0.01';di.focus();di.click();
      setTimeout(()=>{di.style.pointerEvents='none';di.style.opacity='0'},300);
    });
    dw.append(label,cb,di);
    const actions=document.createElement('div');actions.className='day-actions';
    const dd=document.createElement('button');dd.className='icon-btn';dd.textContent='✕';dd.title='Xoá ngày này';
    dd.addEventListener('click',()=>{ps.days=ps.days.filter(d=>d.id!==day.id);renderPerson(person);saveState()});
    actions.appendChild(dd);header.append(dw,actions);inner.appendChild(header);
    const list=document.createElement('ul');list.className='tasks';
    if(!day.tasks.length){const e=document.createElement('div');e.className='empty-day';e.textContent='chưa có việc gì...';list.appendChild(e)}
    day.tasks.forEach(task=>{
      const overdue=dayIsPast&&task.state==='pending';
      const li=document.createElement('li');
      li.className='task'+(task.state==='done'?' done':'')+(task.state==='cancelled'?' cancelled':'')+(overdue?' overdue':'')+(task.late&&task.state==='done'?' late':'');
      const bx=document.createElement('div');bx.className='box'+(overdue?' overdue':'');
      bx.textContent=task.state==='done'?'✓':(task.state==='cancelled'?'×':'');
      bx.addEventListener('click',()=>{
        task.state=task.state==='pending'?'done':task.state==='done'?'cancelled':'pending';
        task.late=task.state==='done'&&dayIsPast;renderPerson(person);saveState();
      });
      const tx=document.createElement('span');tx.className='task-text';tx.textContent=task.text;
      const dl=document.createElement('button');dl.className='del';dl.textContent='✕';dl.title='Xoá việc này';
      dl.addEventListener('click',()=>{day.tasks=day.tasks.filter(t=>t.id!==task.id);renderPerson(person);saveState()});
      li.append(bx,tx,dl);list.appendChild(li);
    });
    inner.appendChild(list);
    const ar=document.createElement('div');ar.className='add-task-row';
    const inp=document.createElement('input');inp.placeholder='thêm việc mới...';
    const ab=document.createElement('button');ab.textContent='+';
    const add=()=>{const v=inp.value.trim();if(!v)return;day.tasks.push({id:uid(),text:v,state:'pending'});inp.value='';renderPerson(person);saveState()};
    ab.addEventListener('click',add);inp.addEventListener('keydown',e=>{if(e.key==='Enter')add()});
    ar.append(inp,ab);inner.appendChild(ar);card.appendChild(inner);
    (dayIsPast?body:daysEl).appendChild(card);
  });
  if(person==='hien'){try{renderHien()}catch(e){console.error(e)}}
}
const renderAll=()=>PEOPLE.forEach(renderPerson);
document.querySelectorAll('.add-day button').forEach(btn=>btn.addEventListener('click',()=>{
  const p=btn.dataset.person;state[p].days.push({id:uid(),date:todayISO(),tasks:[]});renderPerson(p);saveState();
}));

function defaultHien(h){
  h=h||{};
  const ex=Object.assign({lv:1,sessions:0,ticks:[],lastSession:'',msg:'',tickDate:'',doneDate:'',part:[false,false,false,false]},h.ex||{});
  const need=totalSets(ex.lv);
  if(!Array.isArray(ex.ticks)||ex.ticks.length!==need)ex.ticks=Array(need).fill(false);
  if(!Array.isArray(ex.part)||ex.part.length!==4)ex.part=[false,false,false,false];
  return{
    days:Array.isArray(h.days)?h.days:[],
    checkins:Array.isArray(h.checkins)?h.checkins:[],
    ex,
    ngoan:(h.ngoan&&typeof h.ngoan==='object')?h.ngoan:{},
    reward:Object.assign({spins:0,last:'',lastSpecial:0,lastPrize:''},h.reward||{})
  };
}

async function start(){
  state.hien=defaultHien();renderAll();
  try{
    const app=initializeApp(firebaseConfig);db=getFirestore(app);docRef=doc(db,'todo','main');
    const snap=await getDoc(docRef);
    if(!snap.exists())await setDoc(docRef,{bao:{days:[]},hien:defaultHien()});
    onSnapshot(docRef,s=>{
      const data=s.data()||{};
      if(!data.bao&&!data.hien&&Array.isArray(data.days))state={bao:{days:data.days},hien:defaultHien()};
      else state={bao:data.bao&&Array.isArray(data.bao.days)?data.bao:{days:[]},hien:defaultHien(data.hien)};
      const c1=evaluateWeeks(),c2=cleanupOldMonths(),c3=rollExercise();
      renderAll();hideStatusAll();
      if(c1||c2||c3)saveState();
    },err=>showStatusAll('Lỗi kết nối Firestore: '+err.message));
  }catch(e){showStatusAll('Lỗi khởi tạo Firebase: '+e.message)}
}
start();
</script></body></html>
