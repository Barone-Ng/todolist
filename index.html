<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sổ Việc Cần Làm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #fbf8f0;
    --paper-edge: #f1ecdf;
    --line: #dfe6da;
    --ink: #1d3c78;
    --ink-soft: #3a5a9a;
    --red: #cf3a2c;
    --highlight: #cdead0;
    --shadow: rgba(29,60,120,0.14);
  }

  *{ box-sizing: border-box; }
  html, body{ height:100%; }

  body{
    margin:0;
    min-height:100vh;
    background: #e9e4d6;
    background-image:
      radial-gradient(circle at 10% 10%, rgba(255,255,255,0.5), transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(255,255,255,0.4), transparent 40%);
    font-family: 'Be Vietnam Pro', sans-serif;
    color: var(--ink);
    display:flex;
    justify-content:center;
    -webkit-tap-highlight-color: transparent;
  }

  /* Single flex child of body -> this is what actually gets centered.
     Everything else (status banner, title, day notes) lives inside it,
     stacked in a column, so nothing can sit "beside" it and skew the centering. */
  .app{
    width:100%;
    max-width: 480px;
    margin: 40px auto;
    padding: 0 16px;
    display:flex;
    flex-direction: column;
  }

  h1{
    font-family:'Be Vietnam Pro', sans-serif;
    font-weight:800;
    font-size: 1.9rem;
    margin: 0 0 20px;
    color: var(--ink);
    text-align:center;
    letter-spacing: 0.2px;
  }

  .status-banner{
    background: #fff7e6;
    border: 1.5px dashed #d8b25c;
    color:#7a5c17;
    font-family: system-ui, sans-serif;
    font-size: 0.85rem;
    padding: 10px 14px;
    border-radius: 8px;
    text-align:center;
    margin-bottom: 16px;
  }

  /* ---------- one card per day, styled like a separate torn-off note ---------- */
  .day-note{
    position:relative;
    margin-bottom: 30px;
  }
  .day-note::before, .day-note::after{
    content:"";
    position:absolute;
    inset:0;
    background: var(--paper-edge);
    border-radius: 6px;
    z-index:0;
  }
  .day-note::before{ transform: rotate(var(--rot-a, -2deg)) translateY(5px); }
  .day-note::after{ transform: rotate(var(--rot-b, 1.4deg)) translateY(2px); }

  .day-note-inner{
    position:relative;
    z-index:1;
    transform: rotate(var(--rot-c, 0deg));
    background:
      repeating-linear-gradient(
        var(--paper),
        var(--paper) 37px,
        var(--line) 38px
      );
    border-radius: 6px;
    box-shadow: 0 14px 26px var(--shadow), 0 2px 0 rgba(0,0,0,0.04);
    padding: 22px 22px 22px 48px;
  }

  .day-note-inner::before{
    content:"";
    position:absolute;
    top:22px; bottom:22px; left:18px;
    width:11px;
    background-image: radial-gradient(circle, #cfc9b8 0 4.5px, transparent 5px);
    background-size: 11px 42px;
    background-repeat: repeat-y;
    opacity:0.6;
  }

  .day-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin-bottom: 10px;
  }

  .day-date-wrap{
    position:relative;
    display:inline-flex;
    align-items:center;
    gap:6px;
    cursor:pointer;
  }
  .day-date-label{
    font-size: 1.22rem;
    padding: 1px 8px 3px;
    background: linear-gradient(to bottom, transparent 55%, var(--highlight) 55%);
    color: var(--ink);
    white-space:nowrap;
  }
  .day-date-label.placeholder{ color: #8a95ab; font-style: italic; background:none; }
  .cal-btn{
    background:none;
    border:none;
    font-size: 1rem;
    line-height:1;
    opacity:0.55;
    cursor:pointer;
    padding: 2px;
  }
  .day-date-wrap:hover .cal-btn{ opacity:0.9; }
  /* the real input stays in the DOM (so its value + native picker work) but is visually tucked away */
  .day-date-input{
    position:absolute;
    left:0; top:0;
    width:1px; height:1px;
    opacity:0;
    border:none;
    padding:0;
    margin:0;
    pointer-events:none;
  }

  .day-actions{ display:flex; gap:6px; }

  .icon-btn{
    background:none;
    border:none;
    color: var(--ink-soft);
    font-family:'Be Vietnam Pro', sans-serif;
    font-size:1.05rem;
    cursor:pointer;
    opacity:0.55;
    padding:2px 4px;
    line-height:1;
  }
  .icon-btn:hover{ opacity:1; }

  .tasks{ list-style:none; margin:0; padding:0; }

  .task{
    display:flex;
    align-items:flex-start;
    gap:10px;
    padding: 5px 0;
    font-size: 1.12rem;
    line-height:1.35;
  }

  .box{
    flex: 0 0 auto;
    width: 24px; height:24px;
    margin-top:3px;
    border: 2.4px solid var(--ink);
    border-radius: 3px 4px 3px 5px;
    transform: rotate(-1.2deg);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    background: transparent;
    color: var(--red);
    font-size: 1.05rem;
    font-weight:bold;
    user-select:none;
    flex-shrink:0;
    position:relative;
  }
  .box::before{
    content:"";
    position:absolute;
    inset:-11px;
  }

  .task-text{
    flex:1;
    word-break: break-word;
    cursor: default;
  }
  .task.done .task-text{ color: var(--ink-soft); }
  .task.cancelled .task-text{ text-decoration: line-through; text-decoration-thickness: 2px; opacity:0.55; }

  .del{
    opacity:0;
    background:none;border:none;
    color: var(--red);
    font-family:'Be Vietnam Pro', sans-serif;
    cursor:pointer;
    font-size:1rem;
    padding: 2px 4px;
  }
  .task:hover .del{ opacity:0.6; }
  .del:hover{ opacity:1 !important; }

  .add-task-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 6px 0 0 32px;
  }
  .add-task-row input{
    flex:1;
    border:none;
    border-bottom: 1.5px dashed #b9c6de;
    background:transparent;
    font-family:'Be Vietnam Pro', sans-serif;
    font-size: 1.08rem;
    color: var(--ink);
    padding: 2px 2px;
    min-width:0;
  }
  .add-task-row input:focus{ outline:none; border-bottom-color: var(--ink); }
  .add-task-row button{
    background:none; border:none;
    color: var(--ink-soft);
    font-family:'Be Vietnam Pro', sans-serif;
    cursor:pointer;
    font-size:1.4rem;
    line-height:1;
    opacity:0.7;
  }
  .add-task-row button:hover{ opacity:1; }

  .empty-day{
    font-size: 1rem;
    color: #8a95ab;
    padding-left: 32px;
    font-style: italic;
  }

  .add-day{
    display:flex;
    justify-content:center;
    margin-top: 4px;
  }
  .add-day button{
    font-family:'Be Vietnam Pro', sans-serif;
    font-size: 1.05rem;
    color: var(--ink-soft);
    background: transparent;
    border: 2px dashed #b9c6de;
    border-radius: 8px;
    padding: 8px 18px;
    cursor:pointer;
  }
  .add-day button:hover{ border-color: var(--ink-soft); color: var(--ink); }

  @media (max-width: 480px){
    .app{ margin: 20px auto; }
    .day-note-inner{ padding: 18px 16px 18px 38px; }
    .day-note-inner::before{ left: 10px; }
    h1{ font-size: 1.6rem; margin-bottom: 16px; }
    .day-date-label{ font-size: 1.08rem; }
    .task{ font-size: 1.02rem; }
    .add-task-row{ padding-left: 30px; }
    .add-task-row input{ font-size: 1.05rem; }
  }
</style>
</head>
<body>

<div class="app">
  <h1>Việc Cần Làm</h1>
  <div id="status" class="status-banner" style="display:none;"></div>
  <div id="days"></div>
  <div class="add-day">
    <button id="addDayBtn">+ thêm ngày</button>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import {
    getFirestore, doc, onSnapshot, setDoc, getDoc
  } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ---------------------------------------------------------------
  // 1) PASTE YOUR OWN FIREBASE CONFIG HERE
  //    Firebase console -> Project settings -> General -> Your apps -> SDK setup and config
  // ---------------------------------------------------------------
  const firebaseConfig = {
    apiKey: "AIzaSyDUxAPbBWVMxtexFn44-dKMSgmPM8CQAJ8",
    authDomain: "todo-list-d0500.firebaseapp.com",
    projectId: "todo-list-d0500",
    storageBucket: "todo-list-d0500.firebasestorage.app",
    messagingSenderId: "219541712256",
    appId: "1:219541712256:web:f7d492517f970b4c602565"
  };

  const statusEl = document.getElementById('status');
  const daysEl = document.getElementById('days');

  let db = null;
  let docRef = null;
  let state = { days: [] };

  const WEEKDAY_NAMES = ['Chủ Nhật','Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7'];

  function showStatus(msg){
    statusEl.style.display = 'block';
    statusEl.textContent = msg;
  }
  function hideStatus(){ statusEl.style.display = 'none'; }

  function isConfigured(){
    return firebaseConfig.apiKey && !firebaseConfig.apiKey.startsWith("YOUR_");
  }

  function uid(){
    return Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-3);
  }

  function todayISO(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function formatDayLabel(iso){
    if (!iso) return null;
    const d = new Date(iso + 'T00:00:00');
    if (isNaN(d)) return null;
    const wd = WEEKDAY_NAMES[d.getDay()];
    const dm = String(d.getDate()).padStart(2,'0') + '/' + String(d.getMonth()+1).padStart(2,'0');
    return `${wd}, ${dm}`;
  }

  // stable, deterministic "randomness" per day id so cards don't jitter on re-render
  function hashRot(id){
    let h = 0;
    for (let i=0;i<id.length;i++){ h = (h*31 + id.charCodeAt(i)) % 1000; }
    const a = -2.4 + (h % 10) * 0.12;       // ~ -2.4..-1.2
    const b = 1.0 + ((h >> 3) % 10) * 0.12; // ~ 1.0..2.2
    const c = -0.9 + ((h >> 6) % 18) * 0.1; // ~ -0.9..0.8
    return { a, b, c };
  }

  async function saveState(){
    if (!docRef) return;
    try{
      await setDoc(docRef, state);
    }catch(e){
      showStatus("Không lưu được: " + e.message);
    }
  }

  function render(){
    daysEl.innerHTML = '';
    state.days.forEach(day => {
      if (!day.date) day.date = todayISO(); // migrate legacy days with no date

      const rot = hashRot(day.id);

      const card = document.createElement('div');
      card.className = 'day-note';
      card.style.setProperty('--rot-a', rot.a + 'deg');
      card.style.setProperty('--rot-b', rot.b + 'deg');
      card.style.setProperty('--rot-c', rot.c + 'deg');

      const inner = document.createElement('div');
      inner.className = 'day-note-inner';

      const header = document.createElement('div');
      header.className = 'day-header';

      const dateWrap = document.createElement('div');
      dateWrap.className = 'day-date-wrap';

      const label = document.createElement('span');
      const formatted = formatDayLabel(day.date);
      label.className = 'day-date-label' + (formatted ? '' : ' placeholder');
      label.textContent = formatted || 'chọn ngày...';

      const calBtn = document.createElement('button');
      calBtn.type = 'button';
      calBtn.className = 'cal-btn';
      calBtn.title = 'Chọn ngày';
      calBtn.textContent = '📅';

      const dateInput = document.createElement('input');
      dateInput.type = 'date';
      dateInput.className = 'day-date-input';
      dateInput.value = day.date || '';
      dateInput.tabIndex = -1;
      dateInput.addEventListener('change', () => {
        day.date = dateInput.value;
        render(); saveState();
      });

      function openPicker(){
        if (typeof dateInput.showPicker === 'function'){
          try { dateInput.showPicker(); return; } catch(e){ /* fall through */ }
        }
        // fallback for browsers without showPicker(): make it briefly interactive and focus it
        dateInput.style.pointerEvents = 'auto';
        dateInput.style.opacity = '0.01';
        dateInput.focus();
        dateInput.click();
        setTimeout(() => {
          dateInput.style.pointerEvents = 'none';
          dateInput.style.opacity = '0';
        }, 300);
      }

      dateWrap.addEventListener('click', openPicker);

      dateWrap.appendChild(label);
      dateWrap.appendChild(calBtn);
      dateWrap.appendChild(dateInput);

      const actions = document.createElement('div');
      actions.className = 'day-actions';
      const delDayBtn = document.createElement('button');
      delDayBtn.className = 'icon-btn';
      delDayBtn.textContent = '✕';
      delDayBtn.title = 'Xoá ngày này';
      delDayBtn.addEventListener('click', () => {
        state.days = state.days.filter(d => d.id !== day.id);
        render(); saveState();
      });
      actions.appendChild(delDayBtn);

      header.appendChild(dateWrap);
      header.appendChild(actions);
      inner.appendChild(header);

      const list = document.createElement('ul');
      list.className = 'tasks';

      if (day.tasks.length === 0){
        const empty = document.createElement('div');
        empty.className = 'empty-day';
        empty.textContent = 'chưa có việc gì...';
        list.appendChild(empty);
      }

      day.tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task' + (task.state === 'done' ? ' done' : '') + (task.state === 'cancelled' ? ' cancelled' : '');

        const box = document.createElement('div');
        box.className = 'box';
        box.textContent = task.state === 'done' ? '✓' : (task.state === 'cancelled' ? '×' : '');
        box.addEventListener('click', () => {
          task.state = task.state === 'pending' ? 'done'
                     : task.state === 'done' ? 'cancelled'
                     : 'pending';
          render(); saveState();
        });

        const text = document.createElement('span');
        text.className = 'task-text';
        text.textContent = task.text;

        const del = document.createElement('button');
        del.className = 'del';
        del.textContent = '✕';
        del.title = 'Xoá việc này';
        del.addEventListener('click', () => {
          day.tasks = day.tasks.filter(t => t.id !== task.id);
          render(); saveState();
        });

        li.appendChild(box);
        li.appendChild(text);
        li.appendChild(del);
        list.appendChild(li);
      });

      inner.appendChild(list);

      const addRow = document.createElement('div');
      addRow.className = 'add-task-row';
      const input = document.createElement('input');
      input.placeholder = 'thêm việc mới...';
      const addBtn = document.createElement('button');
      addBtn.textContent = '+';

      function addTask(){
        const v = input.value.trim();
        if (!v) return;
        day.tasks.push({ id: uid(), text: v, state: 'pending' });
        input.value = '';
        render(); saveState();
      }
      addBtn.addEventListener('click', addTask);
      input.addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });

      addRow.appendChild(input);
      addRow.appendChild(addBtn);
      inner.appendChild(addRow);

      card.appendChild(inner);
      daysEl.appendChild(card);
    });
  }

  document.getElementById('addDayBtn').addEventListener('click', () => {
    state.days.push({ id: uid(), date: todayISO(), tasks: [] });
    render(); saveState();
  });

  async function start(){
    if (!isConfigured()){
      showStatus('Chưa kết nối Firebase — điền firebaseConfig trong file index.html để lưu dữ liệu.');
      state = {
        days: [
          { id: uid(), date: todayISO(), tasks: [
            { id: uid(), text: 'Máu', state: 'done' },
            { id: uid(), text: 'Đại cương', state: 'pending' }
          ]}
        ]
      };
      render();
      return;
    }

    try{
      const app = initializeApp(firebaseConfig);
      db = getFirestore(app);
      docRef = doc(db, 'todo', 'main');

      const snap = await getDoc(docRef);
      if (!snap.exists()){
        await setDoc(docRef, { days: [] });
      }

      onSnapshot(docRef, (s) => {
        const data = s.data();
        state = data && data.days ? data : { days: [] };
        render();
        hideStatus();
      }, (err) => {
        showStatus('Lỗi kết nối Firestore: ' + err.message);
      });
    }catch(e){
      showStatus('Lỗi khởi tạo Firebase: ' + e.message);
    }
  }

  start();
</script>
</body>
</html>
